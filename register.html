<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register | MessHunt</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="navbar">
    <a href="index.html" class="brand"><span class="brand-name">Mess<span>Hunt</span></span></a>
    <div class="nav-actions"><a class="btn btn-light" href="login.html">Login</a></div>
  </header>

  <main class="auth-page">
    <div class="auth-card" style="max-width:640px;">
      <h1>Create Account</h1>
      <p>Register as a student or mess owner. Admin accounts are managed securely by the system administrator.</p>
      <div id="registerAlert"></div>
      <form id="registerForm">
        <div class="form-grid">
          <div>
            <label for="name">Full Name</label>
            <input type="text" id="name" required placeholder="Your full name" />
          </div>
          <div>
            <label for="role">Register As</label>
            <select id="role" required>
              <option value="student">Student</option>
              <option value="owner">Mess Owner</option>
            </select>
          </div>
          <div>
            <label for="email">Email</label>
            <input type="email" id="email" required placeholder="you@example.com" />
          </div>
          <div>
            <label for="phone">Phone</label>
            <input type="text" id="phone" placeholder="Phone number" />
          </div>
        </div>
        <label for="address">Address (optional)</label>
        <input type="text" id="address" placeholder="City / area" />
        <div class="form-grid">
          <div>
            <label for="password">Password</label>
            <input type="password" id="password" required minlength="6" placeholder="At least 6 characters" />
          </div>
          <div>
            <label for="confirmPassword">Confirm Password</label>
            <input type="password" id="confirmPassword" required minlength="6" placeholder="Re-enter password" />
          </div>
        </div>
        <div class="form-actions">
          <button type="submit" class="btn btn-primary btn-block">Create Account</button>
        </div>
      </form>
      <p style="margin-top:12px;">Already have an account? <a class="inline-link" href="login.html">Login</a></p>
    </div>
  </main>

  <script src="js/api.js"></script>
  <script src="js/common.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const form = document.getElementById('registerForm');
      const alertBox = document.getElementById('registerAlert');
      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        alertBox.innerHTML = '';
        const payload = {
          name: document.getElementById('name').value.trim(),
          role: document.getElementById('role').value,
          email: document.getElementById('email').value.trim(),
          phone: document.getElementById('phone').value.trim(),
          address: document.getElementById('address').value.trim(),
          password: document.getElementById('password').value,
        };
        const confirm = document.getElementById('confirmPassword').value;
        if (payload.password !== confirm) {
          alertBox.innerHTML = '<div class="alert error">Passwords do not match.</div>';
          return;
        }
        try {
          const res = await MHApi.request('/api/auth/register', {
            method: 'POST',
            body: JSON.stringify(payload)
          });
          MHApi.setAuth(res.token, res.user);
          alertBox.innerHTML = '<div class="alert success">Registration successful. Redirecting...</div>';
          const role = res.user.role;
          setTimeout(() => {
            window.location.href = role === 'owner' ? 'owner-dashboard.html' : 'student-dashboard.html';
          }, 600);
        } catch (err) {
          alertBox.innerHTML = `<div class="alert error">${MHUI.escapeHtml(err.message || 'Registration failed')}</div>`;
        }
      });
    });
  </script>
</body>
</html>
