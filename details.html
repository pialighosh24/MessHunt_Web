<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mess Details | MessHunt</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="details.css" />
</head>

<body>
  <header class="navbar">
    <a href="index.html" class="brand" aria-label="MessHunt Home">
      <img src="assets/logo.svg" alt="MessHunt" class="brand-logo"
        onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">
      <div class="brand-fallback" style="display:none;">
        <span class="brand-name">Mess<span>Hunt</span></span>
        <span class="brand-tagline">Find Your Perfect Mess</span>
      </div>
    </a>
    <nav class="desktop-nav">
      <a href="index.html">Home</a>
      <a href="index.html#explore">Explore</a>
    </nav>
    <div class="nav-actions" id="navAuthArea"></div>
  </header>

  <main class="details-layout">
    <div id="pageAlert"></div>

    <section class="panel" id="messHeaderPanel">
      <div class="loading-state">Loading mess details...</div>
    </section>

    <section class="panel" id="galleryPanel" style="display:none;">
      <div class="panel-header">
        <h2>Photos</h2>
      </div>
      <img id="mainGalleryImage" class="gallery-main" src="assets/logo.svg" alt="Accommodation photo"
        onerror="this.src='assets/logo.svg'">
      <div id="thumbRow" class="thumb-row"></div>
      <p class="small-note" id="photoNote" style="margin-top:8px;"></p>
    </section>

    <section class="panel info-sections" id="detailsInfoPanel" style="display:none;"></section>

    <section class="panel" id="locationPanel" style="display:none;"></section>

    <section class="panel" id="reviewsPanel" style="display:none;">
      <div class="panel-header">
        <h2>Reviews & Ratings</h2>
        <div id="ratingSummary" class="muted"></div>
      </div>
      <div id="reviewFormWrap"></div>
      <div id="reviewsList" class="list" style="margin-top:12px;"></div>
    </section>

    <section class="panel" id="bookingPanel" style="display:none;">
      <div class="panel-header">
        <h2>Booking Request</h2>
      </div>
      <div id="bookingWrap"></div>
    </section>
  </main>

  <footer class="footer">
    <div class="footer-top">
      <div class="footer-brand">
        <img src="assets/logo.svg" alt="MessHunt" onerror="this.style.display='none'">
        <span class="brand-name">Mess<span>Hunt</span></span>
      </div>
      <p>Find Your Perfect Mess</p>
    </div>
    <div class="footer-bottom">© 2026 MessHunt • Contact: <a class="inline-link"
        href="mailto:studentmesshunt@gmail.com">studentmesshunt@gmail.com</a></div>
  </footer>

  <script src="js/api.js"></script>
  <script src="js/common.js?v=8"></script>
  <script src="details.js"></script>
</body>

</html>
